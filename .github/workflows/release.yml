name: Release template

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch: {}

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.event.created && !github.event.deleted) }}
    runs-on: ubuntu-latest
    outputs:
      sha256: ${{ steps.build.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: ${{ github.event_name == 'push' && '0' || '1' }}
          persist-credentials: false
      - name: Require the tagged commit to be on master
        if: ${{ github.event_name == 'push' }}
        shell: bash
        run: |
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/master; then
            echo "::error::The release tag must point to a commit on master's history."
            exit 1
          fi
      - name: Install latest stable Bicep compiler
        shell: bash
        env:
          AZURE_BICEP_USE_BINARY_FROM_PATH: 'false'
        run: |
          az bicep upgrade
          az bicep version
      - name: Compile and validate the ARM JSON
        id: build
        shell: bash
        env:
          AZURE_BICEP_USE_BINARY_FROM_PATH: 'false'
        run: |
          set -euo pipefail
          out="$(mktemp -d "$RUNNER_TEMP/arm-release.XXXXXX")/azuredeploy.json"
          az bicep build --file main.bicep --outfile "$out"
          digest="$(node .github/scripts/release-template.mjs validate "$RELEASE_TAG" CHANGELOG.md "$out" azuredeploy.json)"
          echo "Generated azuredeploy.json SHA-256: $digest"
          {
            echo "path=$out"
            echo "sha256=$digest"
          } >> "$GITHUB_OUTPUT"
      - name: Upload the generated template
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: arm-template
          path: ${{ steps.build.outputs.path }}
          if-no-files-found: error

  publish:
    if: ${{ github.event_name == 'push' && github.event.created && !github.event.deleted }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: template-release-publish-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download the generated template from this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: arm-template
          path: ${{ runner.temp }}/arm-template
      - name: Verify the artifact and publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          set -euo pipefail
          asset="$RUNNER_TEMP/arm-template/azuredeploy.json"
          node .github/scripts/release-template.mjs verify "$asset" "$EXPECTED_SHA256"
          notes="$(mktemp "$RUNNER_TEMP/release-notes.XXXXXX")"
          node .github/scripts/release-template.mjs notes "$RELEASE_TAG" CHANGELOG.md > "$notes"

          commit="$(git rev-parse HEAD)"
          tag_ref="refs/tags/$RELEASE_TAG"
          verify_tag() {
            # Use the peeled commit for annotated tags and the raw ref for lightweight tags.
            tag_sha="$(git ls-remote --exit-code origin "$tag_ref" "$tag_ref^{}" | awk -v ref="$tag_ref" '
              $2 == ref { raw = $1 }
              $2 == ref "^{}" { peeled = $1 }
              END { print (peeled ? peeled : raw) }
            ')"
            if [[ "$tag_sha" != "$commit" ]]; then
              echo "::error::The release tag does not match the validated commit."
              exit 1
            fi
          }
          verify_tag

          releases="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name')"
          if grep -Fxq -- "$RELEASE_TAG" <<< "$releases"; then
            echo "::error::A release already exists for $RELEASE_TAG."
            exit 1
          fi
          gh release create "$RELEASE_TAG" "$asset" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "$RELEASE_TAG" --notes-file "$notes"

          verify_tag
          published="$(mktemp -d "$RUNNER_TEMP/published-arm.XXXXXX")"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern azuredeploy.json --dir "$published"
          node .github/scripts/release-template.mjs verify "$published/azuredeploy.json" "$EXPECTED_SHA256"
